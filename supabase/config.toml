# This endpoint validates the bearer token with Auth /user and then checks the
# accepted, device-bound call via the authenticated RPC. No anonymous access.
# Keeping auth in the function supports both legacy and asymmetric JWT keys.
[functions.live-run-ice]
verify_jwt = false

# OAuth redirect has one-use state; every app POST validates Auth /user and the
# current athlete profile in the function. Private RPCs allow service_role only.
[functions.health-whoop]
verify_jwt = false
